function b64bytes(arr){let parts=[];for(let i=0;i<arr.length;i+=8192)parts.push(String.fromCharCode.apply(null,arr.subarray(i,i+8192)));return btoa(parts.join(''))}

function header(title,sub,button){return `<div class="sectionhead"><div><h1 class="h1">${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>${button||''}</div>`}function plusBtn(action){return `<button class="floatingadd" data-open="${action}" aria-label="Добавить">${icon('plus')}</button>`}function zero(title,sub,button='',type='box'){return `<div class="panel"><div class="empty"><div class="emptyicon">${icon(type,28)}</div><h3>${title}</h3><p>${sub}</p>${button}</div></div>`}function stat(label,val,ic,good=false){return `<div class="stat ${good?'good':''}"><div class="iconbg">${icon(ic,18)}</div><div class="eyebrow">${label}</div><div class="val ${String(val).length>11?'smaller':''}">${val}</div></div>`}
function homeView(){const sales=goodSales(month()), rev=sum(sales,revenueOfSale), profit=sum(sales,profitOfSale), stock=sum(activeItems(),p=>p.qty), outs=activeItems().filter(p=>p.qty<=3);let recent=db.sales.filter(s=>!s.canceled).slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,4);return header('Обзор','Магазин под контролем',`<button class="linkbtn" data-nav="reports">Отчёты →</button>`)+`<div class="stats">${stat('Продажи за месяц',money(rev),'wallet')}${stat('Валовая прибыль',money(profit),'chart',true)}${stat('Единиц на складе',fmt.format(stock),'box')}${stat('Продаж за месяц',fmt.format(sales.length),'receipt')}</div><div class="actions"><button class="action" data-open="sale">${icon('plus')} Новая продажа</button><button class="action secondary" data-open="purchase">${icon('down')} Приход товара</button></div>${outs.length?`<div class="label">Заканчивается на складе</div><div class="panel">${outs.slice(0,5).map(p=>productRow(p)).join('')}</div>`:''}<div class="label">Последние продажи</div>${recent.length?`<div class="panel">${recent.map(s=>saleRow(s)).join('')}</div>`:zero('Пока нет продаж','Добавь товар и оформи первую продажу.',`<button class="smallbtn" data-open="product">Добавить товар</button>`,'cart')}<div class="vspace"></div>${cloudHomeStatus()}<p class="hint" style="text-align:center;margin-top:9px">Локальное хранение: ${esc(storageMethod||'Проверяем...')}</p>${!storageWorking?`<div class="vspace"></div><div class="note warn">Хранилище недоступно! Не вводи реальные данные — запись может не сохраниться.</div>`:''}`}
function productRow(p){return `<button class="item" data-product="${esc(p.id)}"><span class="glyph">${icon('box',21)}</span><span class="grow"><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.sku||'Без артикула')} · ${esc(p.category||'Без группы')}</div></span><span class="right"><div class="number ${p.qty<=3?'countlow':''}">${fmt.format(p.qty)} шт.</div><div class="muted">${money(p.priceUAH)}</div></span><span class="chev">${icon('chev',16)}</span></button>`}
function productsView(){let items=activeItems();if(category!=='Все')items=items.filter(x=>category==='Мало'?x.qty<=3:x.category===category);if(query.trim()){const q=query.trim().toLowerCase();items=items.filter(x=>(x.name+' '+x.sku+' '+x.category).toLowerCase().includes(q))}items.sort((a,b)=>a.name.localeCompare(b.name,'ru'));return header('Товары',`${activeItems().length} позиций в каталоге`,plusBtn('product'))+`<div class="searchrow"><label class="search">${icon('search',18)}<input id="product-search" type="search" placeholder="Название или артикул" value="${esc(query)}" autocomplete="off"></label></div><div class="chipbar">${['Все','Мало',...groupedProducts()].map(x=>`<button class="chip ${category===x?'active':''}" data-category="${esc(x)}">${x==='Мало'?'Мало на складе':esc(x)}</button>`).join('')}</div>${items.length?`<div class="panel">${items.map(productRow).join('')}</div>`:zero('Товары не найдены',activeItems().length?'Измени поиск или фильтр.':'Нажми «+», чтобы добавить первую позицию.',!activeItems().length?'<button class="smallbtn" data-open="product">Добавить товар</button>':'')}`}
function saleRow(s){const good=!s.canceled;const label=s.items.length===1?(s.items[0].name):`${s.items.length} позиции`;return `<button class="item" data-sale="${esc(s.id)}"><span class="glyph ${good?'good':''}">${icon('cart',21)}</span><span class="grow"><div class="name">${esc(label)}</div><div class="meta">${timeFmt(s.date)} · ${esc(s.customerName||s.payment||'Продажа')} ${s.ttn?'· ТТН':''}</div></span><span class="right"><div class="number">${money(revenueOfSale(s))}</div><div class="muted">${s.canceled?'Отменена':`+${money(profitOfSale(s))}`}</div></span><span class="chev">${icon('chev',16)}</span></button>`}
function salesView(){let rows=db.sales.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt));if(saleFilter==='Активные')rows=rows.filter(s=>!s.canceled);else if(saleFilter==='С ТТН')rows=rows.filter(s=>!s.canceled&&s.ttn);else if(saleFilter==='Отменены')rows=rows.filter(s=>s.canceled);return header('Продажи',`${db.sales.filter(s=>!s.canceled).length} продаж всего`,plusBtn('sale'))+`<div class="chipbar">${['Все','Активные','С ТТН','Отменены'].map(x=>`<button class="chip ${saleFilter===x?'active':''}" data-salesfilter="${x}">${x}</button>`).join('')}</div>${rows.length?`<div class="panel">${rows.map(saleRow).join('')}</div>`:zero('Продаж пока нет','Здесь появятся покупки клиентов и номера отправлений.',`<button class="smallbtn" data-open="sale">Новая продажа</button>`,'cart')}`}
function purchaseRow(p){return `<button class="item" data-purchase="${esc(p.id)}"><span class="glyph">${icon('down',21)}</span><span class="grow"><div class="name">${esc(p.name)}</div><div class="meta">${timeFmt(p.date)} · ${fmt.format(p.qty)} шт. ${p.supplier?'· '+esc(p.supplier):''}</div></span><span class="right"><div class="number">${money(p.amountUAH)}</div><div class="muted">${dollars(p.unitUSD)} × ${fmt.format(p.rate)}</div></span><span class="chev">${icon('chev',16)}</span></button>`}
function purchasesView(){const arr=db.purchases.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt));return header('Закупки',`${arr.length} поступлений товара`,plusBtn('purchase'))+`${arr.length?`<div class="panel">${arr.map(purchaseRow).join('')}</div>`:zero('Нет закупок','Добавь поступление товара: количество, цену в долларах и курс.',`<button class="smallbtn" data-open="purchase">Новый приход</button>`,'down')}`}
function reportsView(){const s=goodSales(monthFilter),p=monthlyPurchases(monthFilter),rev=sum(s,revenueOfSale),profit=sum(s,profitOfSale),purchase=sum(p,x=>x.amountUAH),payments=['Наличные','Карта','Счёт ФОП'];return header('Отчёты','Результаты за выбранный месяц')+`<div class="monthline"><input id="monthPicker" type="month" value="${esc(monthFilter)}" aria-label="Отчётный месяц"><span class="hint">Отчёт по дате операций</span></div><div class="vspace"></div><div class="stats">${stat('Доход от продаж',money(rev),'wallet')}${stat('Валовая прибыль',money(profit),'chart',true)}${stat('Закупки за месяц',money(purchase),'down')}${stat('Количество продаж',String(s.length),'receipt')}</div><div class="label">Оплата по способам</div><div class="panel panelpad">${payments.map(m=>`<div class="payline"><span>${m}</span><strong>${money(sum(s.filter(x=>x.payment===m),revenueOfSale))}</strong></div>`).join('')}</div><p class="hint" style="margin:11px 4px">Доход и валовая прибыль рассчитаны по продажам. Закупки показаны отдельно: они не вычитаются повторно из валовой прибыли. Это управленческий отчёт, не готовая налоговая декларация.</p><div class="label">Экспорт отчётов</div><div class="panel panelpad"><div class="btnrow"><button class="ghost" data-export="sales">Продажи CSV</button><button class="ghost" data-export="purchases">Закупки CSV</button></div></div><div class="label">Автоматическое резервное копирование</div>${cloudPanel()}<div class="label">Ручная копия в Файлы iPhone</div><div class="panel panelpad"><p class="hint" style="margin:0 0 13px">Дополнительная копия на случай проблем с GitHub. Её нужно сохранить в «Файлы» → iCloud Drive.</p><div class="btnrow"><button class="primary" data-export="backup">${icon('file',18)} Скачать JSON</button><button class="ghost" id="import-btn">Импорт JSON</button></div><input type="file" id="importfile" accept="application/json,.json" hidden></div><div class="label">Информация</div><div class="note">DRONPLUS+ · версия 1.2 · локальная запись мгновенная, облачная копия после включения и только с интернетом. Для восстановления после удаления приложения понадобится сохранённый токен GitHub и пароль шифрования.</div>`}
function field(label,name,type='text',value='',extra=''){return `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}function selectField(label,name,options,selected=''){return `<div class="field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${options.map(([v,label])=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(label)}</option>`).join('')}</select></div>`}
function wrapModal(title,inner){document.getElementById('modals').innerHTML=`<div class="sheetwrap" id="sheetwrap" role="presentation"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheethead"><h2>${esc(title)}</h2><button class="xbtn" id="closemodal" aria-label="Закрыть">×</button></div><div class="sheetbody">${inner}</div></div></div>`;setTimeout(()=>{let el=document.querySelector('.sheet input:not([type=hidden])');if(el&&!matchMedia('(pointer:coarse)').matches)el.focus()},80)}function closeModal(){document.getElementById('modals').innerHTML=''}
function openProductForm(p){const edit=!!p;let html=`<form id="productform"><input type="hidden" name="id" value="${esc(p?.id||'')}"><div class="formbox"><div class="formtitle">Карточка товара</div>${field('Название товара *','name','text',p?.name||'','required maxlength="120"')}${field('Артикул','sku','text',p?.sku||'','maxlength="80"')}${field('Группа (например, Autel)','category','text',p?.category||'','maxlength="60"')}${field('Цена продажи, ₴ *','price','number',p?.priceUAH??'','required min="0" step="0.01" inputmode="decimal"')}</div>${edit?'':`<div class="formbox"><div class="formtitle">Начальный остаток (не входит в закупки месяца)</div>${field('Количество, шт.','qty','number','0','required min="0" step="1" inputmode="numeric"')}<div class="fieldrow">${field('Закупка за 1 шт., $','usd','number','','min="0" step="0.01" inputmode="decimal"')}${field('Курс ₴ за 1 $','rate','number','','min="0" step="0.01" inputmode="decimal"')}</div><p class="hint">Если товар уже на складе, введи количество и себестоимость. Для новых поступлений используй раздел «Закупки».</p></div>`}<button class="primary wide" type="submit">${edit?'Сохранить изменения':'Создать товар'}</button></form>`;wrapModal(edit?'Изменить товар':'Новый товар',html)}
function openPurchaseForm(initial=''){let products=activeItems();if(!products.length){notify('Сначала создай хотя бы один товар');view='products';render();openProductForm();return}let opts=products.map(p=>[p.id,(p.sku?p.sku+' · ':'')+p.name]);let selected=initial||products[0].id;let html=`<form id="purchaseform"><div class="formbox"><div class="formtitle">Поступление на склад</div>${selectField('Товар *','productId',opts,selected)}${field('Количество, шт. *','qty','number','1','required min="1" step="1" inputmode="numeric"')}<div class="fieldrow">${field('Цена закупки за 1 шт., $ *','usd','number',product(selected)?.costUSD||'','required min="0" step="0.01" inputmode="decimal"')}${field('Курс доллара, ₴ *','rate','number',product(selected)?.rate||'','required min="0.01" step="0.01" inputmode="decimal"')}</div><p class="helper" id="purchase-preview"></p></div><div class="formbox"><div class="formtitle">Дополнительно</div>${field('Дата закупки','date','date',today(),'required')}${field('Поставщик','supplier','text','','maxlength="120"')}${field('Примечание','note','text','','maxlength="200"')}</div><button type="submit" class="primary wide">Оприходовать товар</button></form>`;wrapModal('Новая закупка',html);refreshPurchasePreview()}
function refreshPurchasePreview(){let f=document.getElementById('purchaseform');if(!f)return;let q=num(f.elements.qty.value),u=num(f.elements.usd.value),r=num(f.elements.rate.value);document.getElementById('purchase-preview').textContent=Number.isFinite(q*u*r)&&q>=0&&u>=0&&r>0?'Сумма поступления: '+money(q*u*r):'Введи цену и курс для расчёта'}
function cartLine(pId='',qty=1,unitPrice=''){let products=activeItems().filter(p=>p.qty>0);let selected=product(pId)&&product(pId).qty>0?pId:(products[0]?.id||'');let p=product(selected);return `<div class="cartitem"><div class="carthead"><select name="cartProduct" aria-label="Выбрать товар">${products.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.name)} · ${fmt.format(x.qty)} шт.</option>`).join('')}</select><button type="button" class="iconbtn" data-remove-item aria-label="Убрать товар">${icon('trash',18)}</button></div><div class="fieldrow">${field('Количество','cartQty','number',qty,'required min="1" step="1" inputmode="numeric"')}${field('Цена за 1 шт., ₴','cartPrice','number',unitPrice===''?p?.priceUAH||0:unitPrice,'required min="0" step="0.01" inputmode="decimal"')}</div><div class="hint cart-available">Доступно: ${p?.qty||0} шт.</div></div>`}
function openSaleForm(initial=''){let products=activeItems().filter(p=>p.qty>0);if(!products.length){notify('Для продажи нужен товар с положительным остатком');view='products';render();return}const html=`<form id="saleform"><div class="formbox"><div class="formtitle">Состав продажи</div><div id="cartrows">${cartLine(initial)}</div><button type="button" class="smallbtn" id="additem">${icon('plus',14)} Добавить ещё товар</button><div class="sep"></div><div class="totalrow"><span>Сумма продажи</span><strong id="saletotal">0 ₴</strong></div><div class="totalrow"><span>Валовая прибыль (оценка)</span><strong class="profit" id="saleprofit">0 ₴</strong></div></div><div class="formbox"><div class="formtitle">Покупатель и оплата</div>${field('Имя / данные покупателя','customerName','text','','maxlength="120"')}${field('Телефон покупателя','customerPhone','tel','','maxlength="40"')}${selectField('Способ оплаты *','payment',[['Наличные','Наличные'],['Карта','Карта'],['Счёт ФОП','Счёт ФОП']],'Карта')}</div><div class="formbox"><div class="formtitle">Доставка (по необходимости)</div>${field('Номер ТТН','ttn','text','','maxlength="60"')}${selectField('Статус заказа','status',[['Новая','Новая'],['Отправлена','Отправлена'],['Доставлена','Доставлена']],'Новая')}${field('Дата продажи','date','date',today(),'required')}${field('Примечание','note','text','','maxlength="300"')}</div><button class="primary good wide" type="submit">${icon('check')} Сохранить продажу</button></form>`;wrapModal('Новая продажа',html);refreshSalePreview()}
function cartRows(){return [...document.querySelectorAll('#cartrows .cartitem')]}function refreshSalePreview(){let tot=0,pro=0;cartRows().forEach(row=>{const p=product(row.querySelector('[name=cartProduct]').value),q=num(row.querySelector('[name=cartQty]').value),price=num(row.querySelector('[name=cartPrice]').value);let ok=Number.isFinite(q)&&Number.isFinite(price)&&q>0&&price>=0; if(ok){tot+=q*price;pro+=q*(price-(p?.avgCostUAH||0))}row.querySelector('.cart-available').textContent=`Доступно: ${p?.qty||0} шт.`});let a=document.getElementById('saletotal'),b=document.getElementById('saleprofit');if(a)a.textContent=money(tot);if(b)b.textContent=money(pro)}
function openProductDetail(p){const all=db.purchases.filter(x=>x.productId===p.id).length,latest=db.sales.filter(x=>!x.canceled&&x.items.some(i=>i.productId===p.id)).length;let html=`<div class="detailgrid"><div class="detailcell"><div>Остаток</div><strong>${fmt.format(p.qty)} шт.</strong></div><div class="detailcell"><div>Цена продажи</div><strong>${money(p.priceUAH)}</strong></div><div class="detailcell"><div>Средняя закупка</div><strong>${money(p.avgCostUAH)}</strong></div><div class="detailcell"><div>Валовая наценка / шт.</div><strong class="profit">${money(p.priceUAH-p.avgCostUAH)}</strong></div></div><div class="vspace"></div><div class="formbox"><div class="totalrow"><span>Артикул</span><strong>${esc(p.sku||'—')}</strong></div><div class="totalrow"><span>Группа</span><strong>${esc(p.category||'—')}</strong></div><div class="totalrow"><span>Последняя закупка</span><strong>${dollars(p.costUSD||0)}</strong></div><div class="totalrow"><span>Курс закупки</span><strong>${fmt.format(p.rate||0)}</strong></div><div class="totalrow"><span>Приходов / продаж</span><strong>${all} / ${latest}</strong></div></div><div class="btnrow"><button class="primary good" data-action="sell-product" data-id="${esc(p.id)}" ${p.qty<=0?'disabled':''}>${icon('cart')} Продать</button><button class="primary" data-action="restock-product" data-id="${esc(p.id)}">${icon('plus')} Приход</button></div><div class="vspace"></div><div class="btnrow"><button class="ghost" data-action="edit-product" data-id="${esc(p.id)}">Изменить</button><button class="ghost warn" data-action="archive-product" data-id="${esc(p.id)}">В архив</button></div>`;wrapModal(p.name,html)}
function openSaleDetail(s){let html=`<div class="formbox"><div class="formtitle">Товары</div>${s.items.map(i=>`<div class="payline"><span style="max-width:55%">${esc(i.name)} × ${fmt.format(i.qty)}</span><strong>${money(i.unitPrice*i.qty)}</strong></div>`).join('')}<div class="sep"></div><div class="totalrow"><span>Итого</span><strong>${money(revenueOfSale(s))}</strong></div><div class="totalrow"><span>Валовая прибыль</span><strong class="profit">${money(profitOfSale(s))}</strong></div></div><div class="formbox"><div class="totalrow"><span>Дата</span><strong>${esc(s.date)}</strong></div><div class="totalrow"><span>Покупатель</span><strong>${esc(s.customerName||'—')}</strong></div><div class="totalrow"><span>Телефон</span><strong>${esc(s.customerPhone||'—')}</strong></div><div class="totalrow"><span>Оплата</span><strong>${esc(s.payment)}</strong></div><div class="totalrow"><span>ТТН</span><strong>${esc(s.ttn||'—')}</strong></div><div class="totalrow"><span>Статус</span><strong>${esc(s.canceled?'Отменена':s.status)}</strong></div>${s.note?`<div class="sep"></div><p class="hint">${esc(s.note)}</p>`:''}</div>${!s.canceled?`<button class="primary wide" data-action="edit-sale" data-id="${esc(s.id)}">${icon('edit')} Изменить данные заказа</button><div class="vspace"></div><button class="ghost warn" style="width:100%" data-action="cancel-sale" data-id="${esc(s.id)}">Отменить ошибочную продажу</button>`:'<div class="note">Эта продажа отменена. Товары возвращены на склад, сумма исключена из отчётов.</div>'}`;wrapModal('Продажа · '+timeFmt(s.date),html)}
function openEditSale(s){wrapModal('Данные продажи',`<form id="editsaleform"><input type="hidden" name="id" value="${esc(s.id)}"><div class="formbox">${field('Данные покупателя','customerName','text',s.customerName,'maxlength="120"')}${field('Телефон покупателя','customerPhone','tel',s.customerPhone,'maxlength="40"')}${selectField('Оплата','payment',[['Наличные','Наличные'],['Карта','Карта'],['Счёт ФОП','Счёт ФОП']],s.payment)}</div><div class="formbox">${field('Номер ТТН','ttn','text',s.ttn,'maxlength="60"')}${selectField('Статус','status',[['Новая','Новая'],['Отправлена','Отправлена'],['Доставлена','Доставлена']],s.status)}${field('Дата продажи','date','date',s.date,'required')}${field('Примечание','note','text',s.note,'maxlength="300"')}</div><p class="hint">Товары, количество и суммы фиксируются в момент продажи и здесь не редактируются.</p><button class="primary wide" type="submit">Сохранить изменения</button></form>`)}
function openPurchaseDetail(p){wrapModal('Поступление · '+timeFmt(p.date),`<div class="formbox"><div class="payline"><span>Товар</span><strong>${esc(p.name)}</strong></div><div class="payline"><span>Количество</span><strong>${fmt.format(p.qty)} шт.</strong></div><div class="payline"><span>Цена за 1 шт.</span><strong>${dollars(p.unitUSD)}</strong></div><div class="payline"><span>Курс</span><strong>${fmt.format(p.rate)}</strong></div><div class="payline"><span>Стоимость в гривнах</span><strong>${money(p.amountUAH)}</strong></div><div class="payline"><span>Поставщик</span><strong>${esc(p.supplier||'—')}</strong></div>${p.note?`<div class="sep"></div><p class="hint">${esc(p.note)}</p>`:''}</div><div class="note">Закупки не удаляются автоматически, чтобы история склада оставалась корректной.</div>`)}
function getFormData(f){return Object.fromEntries(new FormData(f).entries())}
async function handleProductForm(f){let d=getFormData(f),name=d.name.trim(),price=num(d.price),sku=d.sku.trim(),cat=d.category.trim()||'Без группы';if(!name||!Number.isFinite(price)||price<0){notify('Укажи название и корректную цену');return}if(db.products.some(p=>p.sku&&sku&&p.sku.toLowerCase()===sku.toLowerCase()&&p.id!==d.id)){notify('Такой артикул уже есть');return}if(d.id){const p=product(d.id);if(!p)return;p.name=name;p.sku=sku;p.category=cat;p.priceUAH=price;if(!await save())return;closeModal();render();notify('Карточка обновлена')}else{const qty=num(d.qty),u=d.usd.trim()===''?0:num(d.usd),r=d.rate.trim()===''?0:num(d.rate);if(!Number.isInteger(qty)||qty<0||!Number.isFinite(u)||u<0||!Number.isFinite(r)||r<0||(qty>0&&u>0&&r<=0)){notify('Проверь количество, закупку и курс');return}db.products.push({id:uid(),name,sku,category:cat,priceUAH:price,qty,costUSD:u,rate:r,avgCostUAH:u*r,archived:false,createdAt:new Date().toISOString()});if(!await save())return;closeModal();view='products';category='Все';query='';render();notify('Товар создан')}}
async function handlePurchaseForm(f){let d=getFormData(f),p=product(d.productId),qty=num(d.qty),usd=num(d.usd),rate=num(d.rate);if(!p||!Number.isInteger(qty)||qty<1||!Number.isFinite(usd)||usd<0||!Number.isFinite(rate)||rate<=0||!validDate(d.date)){notify('Проверь дату, количество, цену и курс');return}let unitUAH=usd*rate,amountUAH=unitUAH*qty;p.avgCostUAH=(p.qty*p.avgCostUAH+amountUAH)/(p.qty+qty);p.qty+=qty;p.costUSD=usd;p.rate=rate;db.purchases.push({id:uid(),productId:p.id,name:p.name,qty,unitUSD:usd,rate,amountUAH,supplier:d.supplier.trim(),note:d.note.trim(),date:d.date,createdAt:new Date().toISOString()});if(!await save())return;closeModal();view='purchases';render();notify('Приход сохранён · +'+qty+' шт.')}
function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s+'T12:00:00').getTime())}
async function handleSaleForm(f){let d=getFormData(f),rows=cartRows(),items=[],requested={};if(!validDate(d.date)){notify('Укажи правильную дату продажи');return}for(const row of rows){const productId=row.querySelector('[name=cartProduct]').value,p=product(productId),qty=num(row.querySelector('[name=cartQty]').value),price=num(row.querySelector('[name=cartPrice]').value);if(!p||!Number.isInteger(qty)||qty<=0||!Number.isFinite(price)||price<0){notify('Проверь позиции продажи');return}requested[productId]=(requested[productId]||0)+qty;items.push({productId,name:p.name,sku:p.sku,qty,unitPrice:price,costUAH:p.avgCostUAH})}if(!items.length){notify('Добавь товар в продажу');return}for(const [id,n] of Object.entries(requested)){if(n>product(id).qty){notify('Недостаточно на складе: '+product(id).name);return}}for(const [id,n] of Object.entries(requested))product(id).qty-=n;db.sales.push({id:uid(),items,date:d.date,customerName:d.customerName.trim(),customerPhone:d.customerPhone.trim(),payment:d.payment,ttn:d.ttn.trim(),status:d.status,note:d.note.trim(),canceled:false,createdAt:new Date().toISOString()});if(!await save())return;closeModal();view='sales';render();notify('Продажа сохранена. Остатки обновлены')}
async function handleEditSale(f){let d=getFormData(f),s=db.sales.find(x=>x.id===d.id);if(!s||s.canceled||!validDate(d.date))return;s.customerName=d.customerName.trim();s.customerPhone=d.customerPhone.trim();s.payment=d.payment;s.ttn=d.ttn.trim();s.status=d.status;s.date=d.date;s.note=d.note.trim();if(!await save())return;closeModal();render();notify('Данные заказа сохранены')}
async function cancelSale(id){let s=db.sales.find(x=>x.id===id);if(!s||s.canceled)return;if(!confirm('Отменить продажу? Товары вернутся на склад, продажа исчезнет из итоговых сумм.'))return;s.items.forEach(i=>{let p=product(i.productId);if(!p)return;let oldQty=p.qty;p.avgCostUAH=(p.avgCostUAH*oldQty+i.costUAH*i.qty)/(oldQty+i.qty);p.qty+=i.qty});s.canceled=true;s.canceledAt=new Date().toISOString();if(!await save())return;closeModal();render();notify('Продажа отменена, остатки восстановлены')}
function newFile(name,data,mime){const blob=new Blob([data],{type:mime});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}function csvCell(x){let v=String(x??'');return '"'+v.replace(/"/g,'""')+'"'}function csv(rows){return '\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n')}
function exportFile(which){if(which==='backup'){newFile('DRONPLUS_backup_'+today()+'.json',JSON.stringify(db,null,2),'application/json');notify('Резервная копия готова');return}if(which==='sales'){let rows=[['Дата','Товар','Артикул','Кол-во','Цена продажи ₴','Сумма ₴','Себестоимость ₴','Валовая прибыль ₴','Оплата','Покупатель','Телефон','ТТН','Статус','Примечание']];for(let s of goodSales(monthFilter)){for(let it of s.items)rows.push([s.date,it.name,it.sku,it.qty,it.unitPrice,it.qty*it.unitPrice,it.costUAH*it.qty,(it.unitPrice-it.costUAH)*it.qty,s.payment,s.customerName,s.customerPhone,s.ttn,s.status,s.note])}newFile('DRONPLUS_sales_'+monthFilter+'.csv',csv(rows),'text/csv;charset=utf-8');notify('Отчёт продаж готов');return}let rows=[['Дата','Название','Количество','Закупка USD / шт.','Курс ₴','Сумма ₴','Поставщик','Примечание']];for(let p of monthlyPurchases())rows.push([p.date,p.name,p.qty,p.unitUSD,p.rate,p.amountUAH,p.supplier,p.note]);newFile('DRONPLUS_purchases_'+monthFilter+'.csv',csv(rows),'text/csv;charset=utf-8');notify('Отчёт закупок готов')}
function importFile(file){if(!file)return;const reader=new FileReader();reader.onload=async()=>{try{let dat=JSON.parse(reader.result);if(dat.version!==VERSION||!Array.isArray(dat.products)||!Array.isArray(dat.purchases)||!Array.isArray(dat.sales))throw new Error('format');if(dat.products.length>20000||dat.sales.length>50000||dat.purchases.length>50000)throw new Error('size');if(!confirm('Заменить ВСЕ текущие товары, закупки и продажи данными из резервной копии? Это нельзя отменить.'))return;db=dat;if(!await save())return;view='home';render();notify('Резервная копия восстановлена')}catch(e){notify('Не удалось открыть копию. Нужен JSON-файл DRONPLUS+')}};reader.readAsText(file)}
// Делегирование действий: одна точка обработки для всех экранов
const doc=document;
doc.addEventListener('click',e=>{const t=e.target.closest('[data-cloud],[data-nav],[data-open],[data-product],[data-sale],[data-purchase],[data-category],[data-salesfilter],[data-action],[data-export],[data-remove-item],#additem,#closemodal,#import-btn');if(!t){if(e.target.id==='sheetwrap')closeModal();return}if(t.dataset.cloud){({setup:openCloudForm,restore:restoreCloud,upload:()=>scheduleCloudBackup(0),overwrite:forceCloudReplace,disconnect:disconnectCloud}[t.dataset.cloud])();return}if(t.dataset.nav){view=t.dataset.nav;render();scrollTo({top:0,behavior:'instant'});return}if(t.dataset.category){category=t.dataset.category;render();return}if(t.dataset.salesfilter){saleFilter=t.dataset.salesfilter;render();return}if(t.dataset.open){({product:()=>openProductForm(),purchase:()=>openPurchaseForm(),sale:()=>openSaleForm()}[t.dataset.open])();return}if(t.dataset.product){let p=product(t.dataset.product);if(p)openProductDetail(p);return}if(t.dataset.sale){let s=db.sales.find(x=>x.id===t.dataset.sale);if(s)openSaleDetail(s);return}if(t.dataset.purchase){let p=db.purchases.find(x=>x.id===t.dataset.purchase);if(p)openPurchaseDetail(p);return}if(t.dataset.export){exportFile(t.dataset.export);return}if(t.id==='import-btn'){doc.getElementById('importfile')?.click();return}if(t.id==='closemodal'){closeModal();return}if(t.id==='additem'){let holder=doc.createElement('div');holder.innerHTML=cartLine();doc.getElementById('cartrows').append(holder.firstElementChild);refreshSalePreview();return}if(t.dataset.removeItem!==undefined){let rows=cartRows();if(rows.length<=1){notify('В продаже должна остаться хотя бы одна позиция');return}t.closest('.cartitem').remove();refreshSalePreview();return}if(t.dataset.action){let id=t.dataset.id;switch(t.dataset.action){case 'sell-product':closeModal();openSaleForm(id);break;case 'restock-product':closeModal();openPurchaseForm(id);break;case 'edit-product':{let p=product(id);if(p)openProductForm(p);break}case 'archive-product':{let p=product(id);if(p&&confirm('Переместить товар «'+p.name+'» в архив? Его остаток сохранится, но товар исчезнет из активного списка.')){p.archived=true;save().then(ok=>{if(!ok)return;closeModal();render();notify('Товар перемещён в архив')})}break}case 'edit-sale':{let s=db.sales.find(x=>x.id===id);if(s)openEditSale(s);break}case 'cancel-sale':cancelSale(id);break}return}});
doc.addEventListener('submit',e=>{const form=e.target,formId=form.getAttribute('id');if(formId==='cloudform'){e.preventDefault();connectCloud(form);return}if(!['productform','purchaseform','saleform','editsaleform'].includes(formId))return;e.preventDefault();if(form.dataset.saving==='1')return;form.dataset.saving='1';let button=form.querySelector('[type=submit]');if(button)button.disabled=true;Promise.resolve().then(()=>({productform:handleProductForm,purchaseform:handlePurchaseForm,saleform:handleSaleForm,editsaleform:handleEditSale}[formId])(form)).catch(err=>{console.error('DRONPLUS save error',err);notify('Не удалось сохранить: '+(err.message||'ошибка'))}).finally(()=>{form.dataset.saving='';if(button)button.disabled=false})});
doc.addEventListener('input',e=>{if(e.target.id==='product-search'){let val=e.target.value,sel=e.target.selectionStart;query=val;let parent=document.getElementById('main');if(!parent)return;let f=productsView();parent.innerHTML=f;let input=doc.getElementById('product-search');if(input){input.focus();try{input.setSelectionRange(sel,sel)}catch{}}return}if(e.target.closest('#saleform'))refreshSalePreview();if(e.target.closest('#purchaseform'))refreshPurchasePreview()});
doc.addEventListener('change',e=>{if(e.target.id==='monthPicker'){monthFilter=e.target.value||month();render();return}if(e.target.id==='importfile'){importFile(e.target.files?.[0]);return}if(e.target.matches('[name=cartProduct]')){let p=product(e.target.value);e.target.closest('.cartitem').querySelector('[name=cartPrice]').value=p?.priceUAH??0;refreshSalePreview();return}if(e.target.matches('#purchaseform [name=productId]')){let p=product(e.target.value);let f=e.target.form;f.elements.usd.value=p?.costUSD||'';f.elements.rate.value=p?.rate||'';refreshPurchasePreview()}});
doc.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('sheetwrap'))closeModal()});
initializeStorage();
})();
</script>
